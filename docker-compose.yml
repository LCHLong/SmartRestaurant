services:
  redis:
    image: redis:alpine
    container_name: smart-restaurant-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  ai-service:
    build: ./ai-service
    container_name: smart-restaurant-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    container_name: smart-restaurant-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      - PIPECAT_SERVICE_URL=http://ai-service:8000
    depends_on:
      - redis
      - ai-service
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: smart-restaurant-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
