version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: smart-restaurant-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: smart-restaurant-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    depends_on:
      - redis
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: smart-restaurant-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: smart-restaurant-nginx
    ports:
      - "10000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
